<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nothing here — Draw Phase</title>
<meta name="robots" content="noindex" />
<meta name="color-scheme" content="dark light" />
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="/favicon.ico" sizes="any" />

<script>
  (function () {
    try {
      var saved = localStorage.getItem('drawphase.theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) { /* storage blocked — the default in the markup stands */ }
  })();
</script>

<!--
  Styles are inlined rather than linked. GitHub Pages serves this file for any
  missing path, including deep ones like /a/b/c, so a relative stylesheet link
  would resolve against the wrong directory and load nothing.
-->
<style>
  [data-theme='dark'] {
    --bg: #0D0F16; --surface: #151925; --line: #2A3245;
    --ink: #EDF0F8; --ink-2: #B7C0D6; --ink-3: #808AA4;
    --accent: #E9A93C; --accent-ink: #16191F;
  }
  [data-theme='light'] {
    --bg: #EFF1F7; --surface: #FFFFFF; --line: #D7DEEA;
    --ink: #141824; --ink-2: #414B62; --ink-3: #6B7590;
    --accent: #B4700C; --accent-ink: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center; padding: 32px;
    background: var(--bg);
    background-image: radial-gradient(900px 520px at 72% -10%, rgba(233,169,60,.13), transparent 62%);
    color: var(--ink);
    font-family: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .box { max-width: 460px; text-align: center; }
  .mark { width: 68px; height: 68px; margin: 0 auto 26px; display: block; }
  .code {
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .74rem; letter-spacing: .22em; text-transform: uppercase;
    color: var(--accent); margin: 0 0 10px;
  }
  h1 {
    font-family: 'Bricolage Grotesque', 'Trebuchet MS', 'Segoe UI', sans-serif;
    font-size: clamp(1.9rem, 6vw, 2.6rem); font-weight: 800;
    letter-spacing: -.02em; line-height: 1.05; margin: 0 0 14px;
  }
  p { color: var(--ink-2); margin: 0 0 26px; }
  a.home {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--accent); color: var(--accent-ink);
    font-weight: 600; font-size: .92rem; text-decoration: none;
    padding: 12px 22px; border-radius: 8px;
    transition: filter .16s ease;
  }
  a.home:hover { filter: brightness(1.08); }
  a.home:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .note { font-size: .8rem; color: var(--ink-3); margin: 22px 0 0; }
</style>
</head>
<body>
  <div class="box">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="14" fill="#12151F"/>
      <g transform="translate(32 41.5) scale(1.333)">
        <rect x="-10.5" y="-24" width="21" height="32" rx="4" fill="#35C0AE" transform="rotate(-27)"/>
        <rect x="-10.5" y="-24" width="21" height="32" rx="4" fill="#9A88F2" transform="rotate(27)"/>
        <rect x="-10.5" y="-24" width="21" height="32" rx="4" fill="#E9A93C"/>
        <path d="M0 -15.6 L1.84 -9.84 L7.6 -8 L1.84 -6.16 L0 -0.4 L-1.84 -6.16 L-7.6 -8 L-1.84 -9.84 Z" fill="#12151F"/>
      </g>
    </svg>

    <p class="code">Error 404</p>
    <h1>You drew a blank</h1>
    <p>There's no page at this address. It may have moved, or the link may have a typo in it.</p>
    <a class="home" href="/">Back to the calculator</a>
    <p class="note">Draw Phase · created by Reizu</p>
  </div>
</body>
</html>
